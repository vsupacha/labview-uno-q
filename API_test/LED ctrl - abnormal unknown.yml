info:
  name: LED ctrl - abnormal unknown
  type: http
  seq: 3

http:
  method: POST
  url: http://127.0.0.1:7000/api/v1/led/ctrl
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "leds": ["LED3_B", "LED1_R"],
        "states": [true, false]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
