info:
  name: Digital read - abnormal D14
  type: http
  seq: 5

http:
  method: POST
  url: http://127.0.0.1:7000/api/v1/digital/read
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "pins": [0, 14]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
