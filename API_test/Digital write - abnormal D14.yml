info:
  name: Digital write - abnormal D14
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}/api/v1/digital/write"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "pins": [0, 14],
        "values": [0, 1]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
