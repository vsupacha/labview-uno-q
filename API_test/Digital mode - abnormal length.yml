info:
  name: Digital mode - abnormal length
  type: http
  seq: 10

http:
  method: POST
  url: "{{base_url}}/api/v1/digital/mode"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "pins": [0, 1],
        "modes": [1]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
